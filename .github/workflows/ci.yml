name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The shipping configuration is the FFmpeg build - one installer per platform
  # carries everything (WMA, DTS, Dolby TrueHD) - so CI builds and tests exactly
  # that: a single everything-included build per OS, no separate pure-Rust or
  # "optional" variant. ubuntu-22.04 for Linux (ships FFmpeg 4.4 + llvm-14 to match
  # ffmpeg-next 5.1.1; 6.x removed symbols it still uses, and 24.04 lacks llvm-14).
  test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install audio + FFmpeg + clang dev libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev \
            llvm-14 libclang-14-dev clang-14 cmake
          # ffmpeg-sys-next 5.1.1 pins bindgen 0.59.2, which panics (LexError)
          # against the runner's newer libclang; pin LLVM 14, which it handles.
          echo "LIBCLANG_PATH=/usr/lib/llvm-14/lib" >> "$GITHUB_ENV"

      # Same bindgen/libclang pin on Windows: the runner ships a newer LLVM, so
      # install LLVM 14 and point bindgen at it (LIBCLANG_PATH set in the step below).
      - name: Install LLVM 14 for bindgen (Windows)
        if: runner.os == 'Windows'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "14.0"

      # bindgen (ffmpeg-sys-next) needs the MSVC system headers (stdint.h, ...) on
      # INCLUDE; this sets up the developer environment for the whole job.
      - name: Set up MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install FFmpeg shared dev build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/5.1.2/ffmpeg-5.1.2-full_build-shared.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dev
          $root = (Get-ChildItem ffmpeg-dev -Directory)[0].FullName
          # ffmpeg-sys-next locates the libs/headers via FFMPEG_DIR; also put the
          # FFmpeg include/lib on INCLUDE/LIB (the check.c probe + the linker) and
          # bin on PATH (runtime DLLs). windows-latest ships LLVM for libclang.
          "FFMPEG_DIR=$root"                   | Out-File $env:GITHUB_ENV -Append
          "INCLUDE=$root\include;$env:INCLUDE" | Out-File $env:GITHUB_ENV -Append
          "LIB=$root\lib;$env:LIB"             | Out-File $env:GITHUB_ENV -Append
          "LIBCLANG_PATH=$env:LLVM_PATH\bin" | Out-File $env:GITHUB_ENV -Append
          "$root\bin"                          | Out-File $env:GITHUB_PATH -Append

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Linux builds and tests the full feature set (ffmpeg + gme). libgme is built from
      # source here; build.rs links $GME_DIR and the test binary finds libgme.so via
      # LD_LIBRARY_PATH (its rpath points at $ORIGIN/lib, which the deps/ test binary lacks).
      # The gme decode tests skip without the gitignored qa-music samples, so on CI this is a
      # cross-platform compile check plus the router/MIME guards.
      - name: Build libgme (Linux)
        if: runner.os == 'Linux'
        run: |
          sh packaging/linux/build-gme-min.sh "$PWD/build/gme-min"
          echo "GME_DIR=$PWD/build/gme-min" >> "$GITHUB_ENV"

      - name: Build and test (Linux, ffmpeg + gme)
        if: runner.os == 'Linux'
        run: |
          cargo build --features ffmpeg,gme --verbose
          LD_LIBRARY_PATH="$GME_DIR/lib" cargo test --features ffmpeg,gme --verbose

      # Windows gets the gme feature once the Windows libgme build and DLL bundling land
      # (tracked for the Windows box); for now it builds and tests the ffmpeg set.
      - name: Build and test (Windows, ffmpeg)
        if: runner.os == 'Windows'
        run: |
          cargo build --features ffmpeg --verbose
          cargo test --features ffmpeg --verbose

  # Build the per-user installers. Runs on a v* tag (official release) or a
  # manual dispatch (dry run - artifacts only, no GitHub Release).
  package:
    name: Installer (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 22.04 for the Linux release: FFmpeg 4.4 matches ffmpeg-next 5.1.1, it
        # has llvm-14 for bindgen, and its older glibc widens binary compatibility.
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # The shipped build is the WMA-enabled (ffmpeg) build, so one installer per
      # platform carries everything, FFmpeg libraries included (Option A). The
      # default/test matrix stays pure Rust; only the release packages link FFmpeg.
      - name: Install Linux build + clang libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # No system FFmpeg dev libs: build-tarball.sh builds a self-contained FFmpeg
          # from source (build-ffmpeg-min.sh) and links against that, so we only need a
          # C toolchain + curl to build it, plus llvm-14 for the ffmpeg-sys-next bindgen
          # (its pinned bindgen 0.59.2 panics against the runner's newer libclang).
          # cmake is also needed to build libgme from source for the gme feature.
          sudo apt-get install -y libasound2-dev libgtk-3-dev pkg-config \
            build-essential curl cmake llvm-14 libclang-14-dev clang-14
          echo "LIBCLANG_PATH=/usr/lib/llvm-14/lib" >> "$GITHUB_ENV"

      # Same bindgen/libclang pin on Windows (see the ffmpeg-build job).
      - name: Install LLVM 14 for bindgen (Windows)
        if: runner.os == 'Windows'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "14.0"

      # bindgen (ffmpeg-sys-next) needs the MSVC system headers on INCLUDE.
      - name: Set up MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install FFmpeg shared dev build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/5.1.2/ffmpeg-5.1.2-full_build-shared.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dev
          $root = (Get-ChildItem ffmpeg-dev -Directory)[0].FullName
          # ffmpeg-sys-next finds libs/headers via FFMPEG_DIR; include/lib go on
          # INCLUDE/LIB (the check.c probe + linker), bin on PATH, and the bin dir is
          # also where the installer picks up the DLLs to bundle. LLVM ships on the runner.
          "FFMPEG_DIR=$root"                   | Out-File $env:GITHUB_ENV -Append
          "INCLUDE=$root\include;$env:INCLUDE" | Out-File $env:GITHUB_ENV -Append
          "LIB=$root\lib;$env:LIB"             | Out-File $env:GITHUB_ENV -Append
          "LIBCLANG_PATH=$env:LLVM_PATH\bin" | Out-File $env:GITHUB_ENV -Append
          "$root\bin"                          | Out-File $env:GITHUB_PATH -Append

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # ---- Linux: per-user tarball (ffmpeg + gme, their libraries bundled) ----
      # build-tarball.sh builds and bundles a self-contained FFmpeg and libgme, so the tarball
      # needs no system FFmpeg or libgme at runtime. The Windows installer still ships ffmpeg
      # only until the Windows libgme build and DLL bundling land (Windows box).
      - name: Build Linux tarball
        if: runner.os == 'Linux'
        run: FEATURES=ffmpeg,gme sh packaging/linux/build-tarball.sh

      - name: Upload Linux tarball
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linamp-linux-tarball
          path: dist/*.tar.gz

      # ---- Windows: per-user Inno Setup installer (WMA-enabled, DLLs bundled) ----
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --features ffmpeg
          # Derive the version from Cargo.toml and pass it to ISCC - without this
          # the installer falls back to the version baked into linamp.iss, which
          # is how v0.3.0 shipped a "LinAmp-0.2.0-Setup.exe". /DWithFfmpeg bundles the
          # FFmpeg DLLs from the shared build's bin dir next to the exe.
          $ver = ([regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"')).Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" "/DWithFfmpeg" "/DFfmpegBin=$env:FFMPEG_DIR\bin" packaging\windows\linamp.iss

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: linamp-windows-installer
          path: dist/*Setup.exe

  # Publish a GitHub Release with both installers - tag pushes only.
  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
