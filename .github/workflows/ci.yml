name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux audio dev libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

  # Optional WMA build via the `ffmpeg` Cargo feature (LGPL, opt-in, off by
  # default). Non-blocking (continue-on-error) so it never gates a normal merge,
  # per the plan to keep the pure-Rust matrix as the only required job. It has
  # something to build once the `ffmpeg` feature exists on the branch.
  ffmpeg-build:
    name: WMA/FFmpeg build (${{ matrix.os }}, optional)
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg + clang dev libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev \
            clang libclang-dev

      # bindgen (ffmpeg-sys-next) needs the MSVC system headers (stdint.h, ...) on
      # INCLUDE; this sets up the developer environment for the whole job.
      - name: Set up MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install FFmpeg shared dev build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/6.1.1/ffmpeg-6.1.1-full_build-shared.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dev
          $root = (Get-ChildItem ffmpeg-dev -Directory)[0].FullName
          # ffmpeg-sys-next locates the libs/headers via FFMPEG_DIR; also put the
          # FFmpeg include/lib on INCLUDE/LIB (the check.c probe + the linker) and
          # bin on PATH (runtime DLLs). windows-latest ships LLVM for libclang.
          "FFMPEG_DIR=$root"                   | Out-File $env:GITHUB_ENV -Append
          "INCLUDE=$root\include;$env:INCLUDE" | Out-File $env:GITHUB_ENV -Append
          "LIB=$root\lib;$env:LIB"             | Out-File $env:GITHUB_ENV -Append
          "LIBCLANG_PATH=$env:ProgramFiles\LLVM\bin" | Out-File $env:GITHUB_ENV -Append
          "$root\bin"                          | Out-File $env:GITHUB_PATH -Append

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build (--features ffmpeg)
        run: cargo build --features ffmpeg --verbose

      - name: Test (--features ffmpeg)
        run: cargo test --features ffmpeg --verbose

  # Build the per-user installers. Runs on a v* tag (official release) or a
  # manual dispatch (dry run — artifacts only, no GitHub Release).
  package:
    name: Installer (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # ---- Linux: per-user tarball ----
      - name: Build Linux tarball
        if: runner.os == 'Linux'
        run: sh packaging/linux/build-tarball.sh

      - name: Upload Linux tarball
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linamp-linux-tarball
          path: dist/*.tar.gz

      # ---- Windows: per-user Inno Setup installer ----
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release
          # Derive the version from Cargo.toml and pass it to ISCC — without this
          # the installer falls back to the version baked into linamp.iss, which
          # is how v0.3.0 shipped a "LinAmp-0.2.0-Setup.exe".
          $ver = ([regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"')).Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" packaging\windows\linamp.iss

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: linamp-windows-installer
          path: dist/*Setup.exe

  # Publish a GitHub Release with both installers — tag pushes only.
  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
