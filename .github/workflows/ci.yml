name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The shipping configuration is the FFmpeg build - one installer per platform
  # carries everything (WMA, DTS, Dolby TrueHD) - so CI builds and tests exactly
  # that: a single everything-included build per OS, no separate pure-Rust or
  # "optional" variant. ubuntu-22.04 for Linux (ships FFmpeg 4.4 + llvm-14 to match
  # ffmpeg-next 5.1.1; 6.x removed symbols it still uses, and 24.04 lacks llvm-14).
  test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install audio + FFmpeg + clang dev libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev \
            llvm-14 libclang-14-dev clang-14 cmake
          # ffmpeg-sys-next 5.1.1 pins bindgen 0.59.2, which panics (LexError)
          # against the runner's newer libclang; pin LLVM 14, which it handles.
          echo "LIBCLANG_PATH=/usr/lib/llvm-14/lib" >> "$GITHUB_ENV"

      # Same bindgen/libclang pin on Windows: the runner ships a newer LLVM, so
      # install LLVM 14 and point bindgen at it (LIBCLANG_PATH set in the step below).
      - name: Install LLVM 14 for bindgen (Windows)
        if: runner.os == 'Windows'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "14.0"

      # bindgen (ffmpeg-sys-next) needs the MSVC system headers (stdint.h, ...) on
      # INCLUDE; this sets up the developer environment for the whole job.
      - name: Set up MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install FFmpeg shared dev build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/5.1.2/ffmpeg-5.1.2-full_build-shared.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip -MaximumRetryCount 5 -RetryIntervalSec 5
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dev
          $root = (Get-ChildItem ffmpeg-dev -Directory)[0].FullName
          # ffmpeg-sys-next locates the libs/headers via FFMPEG_DIR; also put the
          # FFmpeg include/lib on INCLUDE/LIB (the check.c probe + the linker) and
          # bin on PATH (runtime DLLs). windows-latest ships LLVM for libclang.
          "FFMPEG_DIR=$root"                   | Out-File $env:GITHUB_ENV -Append
          "INCLUDE=$root\include;$env:INCLUDE" | Out-File $env:GITHUB_ENV -Append
          "LIB=$root\lib;$env:LIB"             | Out-File $env:GITHUB_ENV -Append
          "LIBCLANG_PATH=$env:LLVM_PATH\bin" | Out-File $env:GITHUB_ENV -Append
          "$root\bin"                          | Out-File $env:GITHUB_PATH -Append

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Linux builds and tests the full feature set (ffmpeg + gme). libgme is built from
      # source here; build.rs links $GME_DIR and the test binary finds libgme.so via
      # LD_LIBRARY_PATH (its rpath points at $ORIGIN/lib, which the deps/ test binary lacks).
      # The gme decode tests skip without the gitignored qa-music samples, so on CI this is a
      # cross-platform compile check plus the router/MIME guards.
      - name: Build libgme (Linux)
        if: runner.os == 'Linux'
        run: |
          sh packaging/linux/build-gme-min.sh "$PWD/build/gme-min"
          echo "GME_DIR=$PWD/build/gme-min" >> "$GITHUB_ENV"

      # libopenmpt (the tracker "zoo") is built from source too, the same way as libgme. Its
      # module decode tests skip without the gitignored qa-music samples, so on CI this is the
      # compile check plus the router/MIME guards.
      - name: Build libopenmpt (Linux)
        if: runner.os == 'Linux'
        run: |
          sh packaging/linux/build-openmpt-min.sh "$PWD/build/openmpt-min"
          echo "OPENMPT_DIR=$PWD/build/openmpt-min" >> "$GITHUB_ENV"

      # AdPlug (+ libbinio) for the AdLib/OPL feature, built from source the same way. build.rs
      # compiles the C++ shim and links it. Its decode tests skip without the gitignored qa-music
      # samples, so on CI this is the compile check plus the router/MIME guards.
      - name: Build AdPlug (Linux)
        if: runner.os == 'Linux'
        run: |
          sh packaging/linux/build-adplug-min.sh "$PWD/build/adplug-min"
          echo "ADPLUG_DIR=$PWD/build/adplug-min" >> "$GITHUB_ENV"

      # libsidplayfp (C64 SID) built from source; build.rs compiles the C++ shim and links it. Its
      # decode tests skip without the gitignored qa-music samples, so on CI this is the compile check
      # plus the router/MIME guards.
      - name: Build libsidplayfp (Linux)
        if: runner.os == 'Linux'
        run: |
          sh packaging/linux/build-sidplayfp-min.sh "$PWD/build/sidplayfp-min"
          echo "SIDPLAYFP_DIR=$PWD/build/sidplayfp-min" >> "$GITHUB_ENV"

      # libvgmstream (game-engine streams) built from source via CMake, core-only (no external
      # codecs), so the .so depends only on libc/libm. vgmstream has a C API, so there is no shim;
      # build.rs links $VGMSTREAM_DIR. Decode tests skip without the gitignored qa-music samples, so
      # on CI this is the compile check plus the router/MIME guards.
      - name: Build libvgmstream (Linux)
        if: runner.os == 'Linux'
        run: |
          sh packaging/linux/build-vgmstream-min.sh "$PWD/build/vgmstream-min"
          echo "VGMSTREAM_DIR=$PWD/build/vgmstream-min" >> "$GITHUB_ENV"

      # libupse (PlayStation PSF1/PSF2) built from source; ROM-less (its own HLE FakeBIOS, no PS1
      # BIOS). build.rs compiles the C shim and links $UPSE_DIR. Decode tests skip without the
      # gitignored qa-music samples, so on CI this is the compile check plus the router/MIME guards.
      - name: Build libupse (Linux)
        if: runner.os == 'Linux'
        run: |
          sh packaging/linux/build-upse-min.sh "$PWD/build/upse-min"
          echo "UPSE_DIR=$PWD/build/upse-min" >> "$GITHUB_ENV"

      # The *SF emulator cores (Highly_Theoretical = Sega SSF/DSF, Highly_Quixotic = Capcom QSF,
      # SSEQPlayer = Nintendo DS NCSF) + the shared psflib container parser, built from source; all
      # ROM-less. build.rs compiles each shim and links the core + psflib.
      - name: Build *SF cores + psflib (Linux)
        if: runner.os == 'Linux'
        run: |
          sh packaging/linux/build-psflib-min.sh "$PWD/build/psflib-min"
          sh packaging/linux/build-highly-theoretical-min.sh "$PWD/build/highlytheoretical-min"
          sh packaging/linux/build-highly-quixotic-min.sh "$PWD/build/highlyquixotic-min"
          sh packaging/linux/build-sseqplayer-min.sh "$PWD/build/sseqplayer-min"
          sh packaging/linux/build-lazyusf2-min.sh "$PWD/build/lazyusf2-min"
          sh packaging/linux/build-vio2sf-min.sh "$PWD/build/vio2sf-min"
          sh packaging/linux/build-libgsf-min.sh "$PWD/build/libgsf-min"
          echo "PSFLIB_DIR=$PWD/build/psflib-min" >> "$GITHUB_ENV"
          echo "HIGHLYTHEORETICAL_DIR=$PWD/build/highlytheoretical-min" >> "$GITHUB_ENV"
          echo "HIGHLYQUIXOTIC_DIR=$PWD/build/highlyquixotic-min" >> "$GITHUB_ENV"
          echo "SSEQPLAYER_DIR=$PWD/build/sseqplayer-min" >> "$GITHUB_ENV"
          echo "LAZYUSF_DIR=$PWD/build/lazyusf2-min" >> "$GITHUB_ENV"
          echo "VIO2SF_DIR=$PWD/build/vio2sf-min" >> "$GITHUB_ENV"
          echo "LIBGSF_DIR=$PWD/build/libgsf-min" >> "$GITHUB_ENV"

      - name: Build and test (Linux, ffmpeg + gme + openmpt + adplug + sid + vgmstream + psf + ssf + qsf + ncsf + usf + twosf + gsf)
        if: runner.os == 'Linux'
        run: |
          cargo build --features ffmpeg,gme,openmpt,adplug,sid,vgmstream,psf,ssf,qsf,ncsf,usf,twosf,gsf --verbose
          LD_LIBRARY_PATH="$GME_DIR/lib:$OPENMPT_DIR/lib:$ADPLUG_DIR/lib:$SIDPLAYFP_DIR/lib:$VGMSTREAM_DIR/lib:$UPSE_DIR/lib:$HIGHLYTHEORETICAL_DIR/lib:$HIGHLYQUIXOTIC_DIR/lib:$SSEQPLAYER_DIR/lib:$LAZYUSF_DIR/lib:$VIO2SF_DIR/lib:$LIBGSF_DIR/lib:$PSFLIB_DIR/lib" cargo test --features ffmpeg,gme,openmpt,adplug,sid,vgmstream,psf,ssf,qsf,ncsf,usf,twosf,gsf --verbose

      # Windows builds libgme and its zlib dependency from source (no system libgme/zlib),
      # then builds and tests the full feature set (ffmpeg + gme). build.rs links $GME_DIR;
      # the test binary loads gme.dll and zlib.dll from the bin dirs put on PATH below. The
      # gme decode tests skip without the gitignored qa-music samples, so on CI this is a
      # compile check plus the router/MIME guards, same as Linux.
      - name: Build libgme + zlib (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh packaging\windows\build-gme.ps1
          "GME_DIR=$PWD\build\gme-min"  | Out-File $env:GITHUB_ENV -Append
          "$PWD\build\gme-min\bin"      | Out-File $env:GITHUB_PATH -Append
          "$PWD\build\zlib\bin"         | Out-File $env:GITHUB_PATH -Append

      # libopenmpt has no MSVC build from the autotools source, so Windows consumes the
      # project's official prebuilt dev package (pinned + checksummed) the same way it consumes
      # the prebuilt FFmpeg above. build.rs links $OPENMPT_DIR; the test binary loads
      # libopenmpt.dll and its codec helpers from the bin dir put on PATH.
      - name: Provision libopenmpt (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh packaging\windows\build-openmpt.ps1
          "OPENMPT_DIR=$PWD\build\openmpt-min" | Out-File $env:GITHUB_ENV -Append
          "$PWD\build\openmpt-min\bin"         | Out-File $env:GITHUB_PATH -Append

      # AdPlug (+ libbinio) for the AdLib/OPL feature. Both are built from source: libbinio has no
      # CMake/MSVC build upstream, so the script generates one; AdPlug is built from its git source
      # archive (its release dist tarball omits CMakeLists.txt). On Windows both are linked STATICALLY
      # into the exe (see build-adplug.ps1), so there are no DLLs to put on PATH. build.rs compiles
      # the C++ shim and links $ADPLUG_DIR's static libs.
      - name: Provision AdPlug (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh packaging\windows\build-adplug.ps1
          "ADPLUG_DIR=$PWD\build\adplug-min" | Out-File $env:GITHUB_ENV -Append

      # libsidplayfp (C64 SID) built from source. libsidplayfp has no CMake/MSVC build upstream, so
      # the script generates one; 2.x bundles the reSIDfp engine (one library) and the release tarball
      # ships the pre-assembled PSID driver, so no 6502 assembler is needed. Linked STATICALLY into the
      # exe (no DLL on PATH), same as AdPlug. build.rs compiles the C++ shim and links $SIDPLAYFP_DIR.
      - name: Provision libsidplayfp (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh packaging\windows\build-sidplayfp.ps1
          "SIDPLAYFP_DIR=$PWD\build\sidplayfp-min" | Out-File $env:GITHUB_ENV -Append

      # libvgmstream (game-engine streams) built core-only from source via CMake (vgmstream has
      # first-class MSVC support). Static-linked into the exe (no DLL on PATH), same as AdPlug/SID.
      # build.rs links $VGMSTREAM_DIR; src/vgmstream.rs binds the C API directly (no shim).
      - name: Provision libvgmstream (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh packaging\windows\build-vgmstream.ps1
          "VGMSTREAM_DIR=$PWD\build\vgmstream-min" | Out-File $env:GITHUB_ENV -Append

      # libupse (PlayStation PSF1) built from the Kodi audiodecoder.upse source (ROM-less FakeBIOS).
      # Static-linked into the exe (no DLL on PATH), same as the others; needs the static zlib from the
      # GME step above (PSF program sections are zlib-compressed), so this runs after it.
      - name: Provision libupse (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh packaging\windows\build-upse.ps1
          "UPSE_DIR=$PWD\build\upse-min" | Out-File $env:GITHUB_ENV -Append

      # The shared psflib container parser plus the three PSF-family cores, built from source as static
      # libs, all ROM-less: Highly_Theoretical (Sega SSF/DSF), Highly_Quixotic (Capcom QSF QSound), and
      # SSEQPlayer (Nintendo NCSF, a C++ SDAT sequencer). psflib needs the static zlib from the GME step
      # above, so this runs after it. build.rs compiles each shim and links the cores.
      - name: Provision psflib + Sega/Capcom/Nintendo *SF cores (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh packaging\windows\build-psflib.ps1
          pwsh packaging\windows\build-highly-theoretical.ps1
          pwsh packaging\windows\build-highly-quixotic.ps1
          pwsh packaging\windows\build-sseqplayer.ps1
          pwsh packaging\windows\build-lazyusf2.ps1
          pwsh packaging\windows\build-vio2sf.ps1
          "PSFLIB_DIR=$PWD\build\psflib-min" | Out-File $env:GITHUB_ENV -Append
          "HIGHLYTHEORETICAL_DIR=$PWD\build\highlytheoretical-min" | Out-File $env:GITHUB_ENV -Append
          "HIGHLYQUIXOTIC_DIR=$PWD\build\highlyquixotic-min" | Out-File $env:GITHUB_ENV -Append
          "SSEQPLAYER_DIR=$PWD\build\sseqplayer-min" | Out-File $env:GITHUB_ENV -Append
          "LAZYUSF_DIR=$PWD\build\lazyusf2-min" | Out-File $env:GITHUB_ENV -Append
          "VIO2SF_DIR=$PWD\build\vio2sf-min" | Out-File $env:GITHUB_ENV -Append

      - name: Build and test (Windows, ffmpeg + gme + openmpt + adplug + sid + vgmstream + psf + ssf + qsf + ncsf + usf + twosf)
        if: runner.os == 'Windows'
        run: |
          cargo build --features ffmpeg,gme,openmpt,adplug,sid,vgmstream,psf,ssf,qsf,ncsf,usf,twosf --verbose
          cargo test --features ffmpeg,gme,openmpt,adplug,sid,vgmstream,psf,ssf,qsf,ncsf,usf,twosf --verbose

  # Build the per-user installers. Runs on a v* tag (official release) or a
  # manual dispatch (dry run - artifacts only, no GitHub Release).
  package:
    name: Installer (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 22.04 for the Linux release: FFmpeg 4.4 matches ffmpeg-next 5.1.1, it
        # has llvm-14 for bindgen, and its older glibc widens binary compatibility.
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # The shipped build is the WMA-enabled (ffmpeg) build, so one installer per
      # platform carries everything, FFmpeg libraries included (Option A). The
      # default/test matrix stays pure Rust; only the release packages link FFmpeg.
      - name: Install Linux build + clang libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # No system FFmpeg dev libs: build-tarball.sh builds a self-contained FFmpeg
          # from source (build-ffmpeg-min.sh) and links against that, so we only need a
          # C toolchain + curl to build it, plus llvm-14 for the ffmpeg-sys-next bindgen
          # (its pinned bindgen 0.59.2 panics against the runner's newer libclang).
          # cmake is also needed to build libgme from source for the gme feature.
          sudo apt-get install -y libasound2-dev libgtk-3-dev pkg-config \
            build-essential curl cmake llvm-14 libclang-14-dev clang-14
          echo "LIBCLANG_PATH=/usr/lib/llvm-14/lib" >> "$GITHUB_ENV"

      # Same bindgen/libclang pin on Windows (see the ffmpeg-build job).
      - name: Install LLVM 14 for bindgen (Windows)
        if: runner.os == 'Windows'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "14.0"

      # bindgen (ffmpeg-sys-next) needs the MSVC system headers on INCLUDE.
      - name: Set up MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install FFmpeg shared dev build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/5.1.2/ffmpeg-5.1.2-full_build-shared.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip -MaximumRetryCount 5 -RetryIntervalSec 5
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dev
          $root = (Get-ChildItem ffmpeg-dev -Directory)[0].FullName
          # ffmpeg-sys-next finds libs/headers via FFMPEG_DIR; include/lib go on
          # INCLUDE/LIB (the check.c probe + linker), bin on PATH, and the bin dir is
          # also where the installer picks up the DLLs to bundle. LLVM ships on the runner.
          "FFMPEG_DIR=$root"                   | Out-File $env:GITHUB_ENV -Append
          "INCLUDE=$root\include;$env:INCLUDE" | Out-File $env:GITHUB_ENV -Append
          "LIB=$root\lib;$env:LIB"             | Out-File $env:GITHUB_ENV -Append
          "LIBCLANG_PATH=$env:LLVM_PATH\bin" | Out-File $env:GITHUB_ENV -Append
          "$root\bin"                          | Out-File $env:GITHUB_PATH -Append

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # ---- Linux: per-user tarball (ffmpeg + gme + openmpt, their libraries bundled) ----
      # build-tarball.sh builds and bundles a self-contained FFmpeg, libgme and libopenmpt, so the
      # tarball needs none of them at runtime. The Windows installer ships ffmpeg + gme; libopenmpt
      # on Windows lands when the Windows box adds its build and DLL bundling.
      - name: Build Linux tarball
        if: runner.os == 'Linux'
        run: FEATURES=ffmpeg,gme,openmpt,adplug,sid,vgmstream,psf,ssf,qsf,ncsf,usf,twosf,gsf sh packaging/linux/build-tarball.sh

      - name: Upload Linux tarball
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linamp-linux-tarball
          path: dist/*.tar.gz

      # ---- Windows: per-user Inno Setup installer (ffmpeg + gme + openmpt, DLLs bundled) ----
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: Build libgme + zlib (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh packaging\windows\build-gme.ps1
          "GME_DIR=$PWD\build\gme-min" | Out-File $env:GITHUB_ENV -Append

      - name: Provision libopenmpt (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh packaging\windows\build-openmpt.ps1
          "OPENMPT_DIR=$PWD\build\openmpt-min" | Out-File $env:GITHUB_ENV -Append

      - name: Provision AdPlug (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh packaging\windows\build-adplug.ps1
          "ADPLUG_DIR=$PWD\build\adplug-min" | Out-File $env:GITHUB_ENV -Append

      - name: Provision libsidplayfp (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh packaging\windows\build-sidplayfp.ps1
          "SIDPLAYFP_DIR=$PWD\build\sidplayfp-min" | Out-File $env:GITHUB_ENV -Append

      - name: Provision libvgmstream (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh packaging\windows\build-vgmstream.ps1
          "VGMSTREAM_DIR=$PWD\build\vgmstream-min" | Out-File $env:GITHUB_ENV -Append

      - name: Provision libupse (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh packaging\windows\build-upse.ps1
          "UPSE_DIR=$PWD\build\upse-min" | Out-File $env:GITHUB_ENV -Append

      # psflib + the three PSF-family cores (Highly_Theoretical SSF/DSF, Highly_Quixotic QSF,
      # SSEQPlayer NCSF), static, ROM-less. psflib needs the static zlib from the GME step, so this runs
      # after it. All link into the exe (no DLL to bundle).
      - name: Provision psflib + Sega/Capcom/Nintendo *SF cores (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh packaging\windows\build-psflib.ps1
          pwsh packaging\windows\build-highly-theoretical.ps1
          pwsh packaging\windows\build-highly-quixotic.ps1
          pwsh packaging\windows\build-sseqplayer.ps1
          pwsh packaging\windows\build-lazyusf2.ps1
          pwsh packaging\windows\build-vio2sf.ps1
          "PSFLIB_DIR=$PWD\build\psflib-min" | Out-File $env:GITHUB_ENV -Append
          "HIGHLYTHEORETICAL_DIR=$PWD\build\highlytheoretical-min" | Out-File $env:GITHUB_ENV -Append
          "HIGHLYQUIXOTIC_DIR=$PWD\build\highlyquixotic-min" | Out-File $env:GITHUB_ENV -Append
          "SSEQPLAYER_DIR=$PWD\build\sseqplayer-min" | Out-File $env:GITHUB_ENV -Append
          "LAZYUSF_DIR=$PWD\build\lazyusf2-min" | Out-File $env:GITHUB_ENV -Append
          "VIO2SF_DIR=$PWD\build\vio2sf-min" | Out-File $env:GITHUB_ENV -Append

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --features ffmpeg,gme,openmpt,adplug,sid,vgmstream,psf,ssf,qsf,ncsf,usf,twosf
          # Derive the version from Cargo.toml and pass it to ISCC - without this
          # the installer falls back to the version baked into linamp.iss, which
          # is how v0.3.0 shipped a "LinAmp-0.2.0-Setup.exe". /DWithFfmpeg bundles the
          # FFmpeg DLLs from the shared build's bin dir, /DWithGme bundles gme.dll plus
          # its zlib.dll dependency, and /DWithOpenmpt bundles libopenmpt.dll plus its
          # codec helper DLLs, next to the exe. The adplug feature needs no bundling: AdPlug
          # and libbinio are linked statically into the exe on Windows.
          $ver = ([regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"')).Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" "/DWithFfmpeg" "/DFfmpegBin=$env:FFMPEG_DIR\bin" "/DWithGme" "/DGmeBin=$PWD\build\gme-min\bin" "/DZlibBin=$PWD\build\zlib\bin" "/DWithOpenmpt" "/DOpenmptBin=$PWD\build\openmpt-min\bin" packaging\windows\linamp.iss

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: linamp-windows-installer
          path: dist/*Setup.exe

  # Publish a GitHub Release with both installers - tag pushes only.
  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
