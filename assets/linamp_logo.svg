<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="LinAmp logo: green lightning bolt on a circle">
  <title>LinAmp logo</title>
  <defs>
    <radialGradient id="disc" cx="42%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="55%" stop-color="#101010"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b6ff5c"/>
      <stop offset="45%" stop-color="#39ff14"/>
      <stop offset="100%" stop-color="#15b400"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Backing circle -->
  <circle cx="128" cy="128" r="120" fill="url(#disc)" stroke="#39ff14" stroke-width="7"/>
  <circle cx="128" cy="128" r="110" fill="none" stroke="#39ff14" stroke-width="1.5" opacity="0.35"/>

  <!-- Lightning bolt -->
  <g filter="url(#glow)">
    <path d="M150 34 L78 140 L116 140 L104 222 L182 108 L140 108 Z"
          fill="url(#bolt)" stroke="#0a3d00" stroke-width="3" stroke-linejoin="round"/>
    <!-- highlight edge -->
    <path d="M150 34 L78 140 L116 140" fill="none" stroke="#d6ffb0" stroke-width="2.5"
          stroke-linejoin="round" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
