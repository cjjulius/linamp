[package]
name = "linamp"
version = "1.2.4"
edition = "2021"
description = "LinAmp - a Winamp-inspired audio player for Linux and Windows, built in Rust"
authors = ["LinAmp contributors"]
license = "Apache-2.0"
repository = "https://github.com/cjjulius/linamp"

[dependencies]
eframe = { version = "0.29", default-features = true }
egui = "0.29"
rodio = { version = "0.20", default-features = false }
lofty = "0.21"
rfd = "0.15"
walkdir = "2"
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
rustfft = "6"
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTP(S) client for streaming "Open location" URLs (internet radio / remote
# files) and the background MusicBrainz CD lookup. Blocking, pure-Rust TLS; used
# only on background threads.
ureq = "2"
# SHA-1 for the MusicBrainz Disc ID, computed from the CD's TOC to look up the
# disc's titles/artist/album (#191). RustCrypto, MIT/Apache-2.0.
sha1 = "0.10"
# The sole decode path: symphonia directly, for both local files (src/decode.rs)
# and non-seekable network streams (src/stream.rs). rodio's own Decoder is unused,
# so rodio pulls no symphonia of its own (no symphonia-* features above), keeping a
# single symphonia 0.6 in the tree rather than a second 0.5 copy.
symphonia = { version = "0.6", default-features = false, features = ["mp1", "mp2", "mp3", "aac", "isomp4", "mkv", "caf", "ogg", "vorbis", "flac", "pcm", "alac", "wav", "aiff", "adpcm"] }
# Open a URL in the user's default browser (the Minibrowser's "nod" action).
open = "5"
rustysynth = "1.3.8"
xmrs = "0.15.2"
xmrsplayer = "0.15.0"
self_cell = "1.3.0"
# Monkey's Audio (.ape) decoding (#182). Pure Rust, MIT/Apache-2.0, tiny deps
# (crc32fast + md-5). symphonia has no APE decoder and there is no other viable
# one, so crate::ape wraps this as a special-case seekable source like MIDI/tracker.
# Vetted bit-exact against ffmpeg across every compression level before adding.
ape-decoder = "0.3.2"
# AC-3 / E-AC-3 (Dolby Digital) decoding (#161). Clean-room, pure Rust, MIT/Apache,
# one dep (thiserror). The free C decoders (liba52, ffmpeg) are GPL and so were off
# limits under our Apache license; this permissive pure-Rust decoder clears that.
# Vetted against ffmpeg (RMS ~1e-5 on sine and real music) before adding.
filmcraft-ac3 = "0.9.0"
# OS clipboard access for the right-click Paste in text fields (egui has no API to
# read the clipboard on demand). Same crate eframe already uses internally.
arboard = "3"
# libopus bindings for Opus decoding (#181). symphonia 0.6 demuxes Opus in
# Ogg/MP4/WebM but ships no Opus decoder, so decode::open_file feeds the demuxed
# packets to libopus. The crate also exposes an encoder, which the later
# rip/convert work (#185) can reuse, keeping one libopus in the tree. libopus is
# BSD-3; the crate is MIT/Apache and vendors + builds it (needs cmake at build).
opus = "0.4.0"
hound = "3.5.1"
mp3lame-encoder = "0.2.5"
vorbis_rs = "0.5.6"
# FLAC encoding for convert/rip output (#190). Pure Rust, Apache-2.0, widely used.
# FLAC decoding/playback already works through symphonia; this adds it as an output.
flacenc = "0.5.1"
ogg = "0.9.2"
rubato = "0.15"
# WavPack (.wv) decoding. symphonia 0.6's `wavpack` feature is a non-functional
# stub, so crate::wavpack wraps wavicle (pure Rust, MIT/Apache-2.0,
# #![forbid(unsafe_code)], verified against the reference wvunpack/wavpack) as a
# seekable source, like ape/ac3/midi. Lossless 16- and 24-bit integer mono/stereo;
# float/8-bit/multichannel are refused cleanly. Vetted bit-exact against the source
# PCM across variants before adding. Trailing APEv2/ID3 tags are trimmed first
# (wavicle 0.1 errors on them), and float streams are rejected up front (0.1 decodes
# them to noise while returning Ok).
wavicle = "0.1.0"
mpeg2ts-reader = "0.18.2"
# AVI (.avi) demuxing. symphonia can't demux AVI, so crate::avi pulls the audio
# stream out and reuses the decoders (MP3/MP2/PCM via symphonia, AC-3 via crate::ac3).
# Pure Rust, MIT/Apache-2.0, same author as the trusted filmcraft-ac3 we already ship.
filmcraft-avi = "0.9.0"
# FLV (.flv) demuxing. symphonia can't demux Flash Video, so crate::flv pulls the
# audio tags out and reuses the decoders: MP3 directly, AAC wrapped in ADTS from its
# AudioSpecificConfig. Pure Rust, MIT/Apache-2.0. Trade-off: it also pulls the pure-Rust
# scuffle-h264/h265 video parsers that we don't use (FLV is minor, so accepted). Leaner
# FLV crates exist (flv-core, oxideav-flv) but are less mature.
scuffle-flv = "0.2.2"
# Bytes buffer type that scuffle-flv's demux API takes.
bytes = "1.12.1"
# MPEG Program Stream (.mpg/.mpeg/.vob) demuxing. symphonia can't demux a program
# stream, so crate::ps pulls the audio ES out and reuses the decoders (MPEG audio via
# symphonia, AC-3 via crate::ac3). Pure Rust, MIT/Apache-2.0.
mpeg-ps = "0.6.0"
# True Audio (.tta) decoding. symphonia has no TTA decoder, so crate::tta wraps
# oxideav-tta (pure Rust, MIT) as a seekable source like ape/wavpack. Vetted
# bit-exact against the source PCM and ~640x real-time before adding.
oxideav-tta = "0.0.4"
# Musepack (.mpc) decoding, SV7 and SV8. symphonia has no Musepack decoder, so
# crate::mpc wraps oxideav-musepack (pure Rust, MIT) as a whole-file seekable
# source like ape/tta/wavpack. It is the only permissive option (the one other
# crate is GPL). decode_mpc_stream_tagged() is a clean bytes-in / PCM-out entry;
# its oxideav-core dependency is only used by an optional registry adapter we don't
# touch. Vetted before adding: real-music SV8 decode within 1 LSB of the ffmpeg
# mpc8 oracle at ~31x real-time, and the crate's own real mppenc SV7/SV8 fixtures
# within 1 LSB. Pinned exact: it is a "clean-room rebuild in progress", so an
# auto-upgrade could regress; bump deliberately after re-vetting.
oxideav-musepack = "=0.0.4"
# DSD (.dsf/.dff) container parsing. symphonia has no DSD support, so crate::dsd uses
# dsd-reader (pure Rust, MIT/Apache) to pull the planar 1-bit DSD stream, then does its
# own DSD->PCM decimation (a windowed-sinc FIR, then rubato to 44.1k). Uncompressed DSD
# only: DST-compressed DFF is refused (its only decoder, cladst, is GPL). Mono/stereo.
dsd-reader = "0.4.0"
# Speex (.spx) decoding. symphonia has no Speex decoder, and the pure-Rust option
# (oxideav-speex) decodes incorrectly (vetted: NB ~0.66, WB ~0.27 correlation vs the
# reference), so crate::speex uses libspeex through speex-safe (vendored C, built from
# source like our libopus; MPL-2.0/BSD-3). The `ogg` crate (already a dep) demuxes the
# Ogg container and the packets are fed to libspeex, mirroring the Opus path. NB/WB/UWB,
# mono and stereo (stereo is decoded as dual-mono for now).
speex-safe = "0.6.0"
# AMR (.amr/.awb) decoding. symphonia has no AMR decoder; crate::amr uses
# rvoip-codec-core's pure-Rust AMR-NB/WB decoder (MIT), which unlike the Speex case
# is correct (vetted 0.9999 correlation vs the ffmpeg oracle; it is tested against the
# 3GPP conformance sequences). Only the amr-nb/amr-wb features are enabled, so its
# optional Opus (C) dependency is not pulled. The .amr storage container is parsed here
# directly (trivial: magic + mode-tagged frames).
rvoip-codec-core = { version = "0.4.0", default-features = false, features = ["amr-nb", "amr-wb"] }
# Optional FFmpeg bindings for the `ffmpeg` feature (WMA and other proprietary
# codecs with no permissive pure-Rust decoder). default-features off so it links
# only the libav* we actually use (avcodec + avformat + avutil + swresample) and
# not avfilter/avdevice/swscale, which aren't installed and aren't needed. See the
# [features] section at the bottom of the file.
ffmpeg-next = { version = "5.1.1", optional = true, default-features = false, features = ["codec", "format", "software-resampling"] }
qoaudio = { version = "0.7.0", optional = true }
cuna = "0.7.0"
quick-xml = "0.41"

# Linux/X11 only: query the global cursor position (XQueryPointer) so classic
# windows can be dragged and docked as a group, matching the Windows behaviour.
# dlopen-based, so it adds no link-time requirement and is absent on Windows.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11-dl = "2"

# Linux only: raw CD-ROM ioctls (CDROMREADTOCHDR / CDROMREADAUDIO) for native
# audio-CD reading (#160). libc is MIT/Apache-2.0, so it keeps the drive layer
# off the GPL libcdio path. Not pulled in on Windows or macOS.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# Linux only: a StatusNotifierItem (system-tray icon) over D-Bus for #40. ksni
# talks D-Bus through pure-Rust zbus, so there's no GTK or libdbus C dependency.
# The "blocking" feature exposes a synchronous spawn, which suits our non-async
# egui loop; it runs the service on its own background thread.
ksni = { version = "0.3.7", features = ["blocking"] }
# Linux only: serve MPRIS (org.mpris.MediaPlayer2) over D-Bus for the global media
# keys (#165). This is the standard route desktops use to deliver the keyboard
# transport keys to a player. zbus 5 is already in the tree via ksni, so we share
# that copy rather than pulling a second one. The "tokio" feature is already active
# on the shared zbus, so the backend drives it from its own current-thread tokio
# runtime on the media-keys thread.
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", default-features = false, features = ["rt", "sync", "net", "time", "io-util"] }

# Windows only: embed the application icon into linamp.exe as a resource so the
# file and taskbar show the LinAmp icon (the in-app window icon is set from the
# embedded PNG at runtime). Build-time only.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Build-time only: compile the small C++ shim over AdPlug (the `adplug` feature). cc only runs
# when build.rs asks it to, i.e. when CARGO_FEATURE_ADPLUG is set, so a default build never
# invokes it. MIT/Apache-2.0.
[build-dependencies]
cc = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Optional FFmpeg (LGPL, links libav*) for proprietary codecs with no permissive
# pure-Rust decoder, chiefly WMA. Off by default so the normal build stays pure
# Rust; enable with `--features ffmpeg` (needs the system FFmpeg dev libraries).
[features]
ffmpeg = ["dep:ffmpeg-next"]
# QOA (Quite OK Audio, .qoa): a simple 2023 lossy format, decoded by the pure-Rust qoaudio crate
# (MIT/Apache-2.0). No native library, no FFI - crate::qoa wraps qoaudio as a seekable rodio Source.
qoa = ["dep:qoaudio"]
# Chiptune/console music via libgme (LGPL), linked through a hand-rolled FFI in src/gme.rs.
# No Rust crate dependency; build.rs emits the link directives and bundles libgme.so. Needs
# a libgme build at $GME_DIR (default build/gme-min, produced by packaging/linux/build-gme-min.sh).
gme = []
# The tracker "zoo" (~30 module formats beyond xmrs's mod/xm/s3m/it) via libopenmpt
# (BSD-3-Clause), linked through a hand-rolled FFI in src/openmpt.rs. No Rust crate dependency;
# build.rs emits the link directives and bundles libopenmpt.so. Needs a libopenmpt build at
# $OPENMPT_DIR (default build/openmpt-min, produced by packaging/linux/build-openmpt-min.sh).
openmpt = []
# AdLib / OPL FM-synthesis formats (~40: DRO, CMF, RAD, HSC, ROL, LAA, IMF/WLF, Doom MUS, and
# many more) via AdPlug (LGPL-2.1+). AdPlug is C++-only, so build.rs compiles a small C++ shim
# (src/adplug_shim.cpp) via the cc crate and links libadplug + libbinio, bundling both .so files.
# Needs an AdPlug build at $ADPLUG_DIR (default build/adplug-min, from build-adplug-min.sh).
adplug = []
# Commodore 64 SID music (.sid PSID/RSID) via libsidplayfp (GPL-2.0+, reSIDfp engine). C++-only,
# so build.rs compiles a C++ shim (src/sid_shim.cpp) via the cc crate and links libsidplayfp,
# bundling the .so. Needs a libsidplayfp build at $SIDPLAYFP_DIR (default build/sidplayfp-min, from
# build-sidplayfp-min.sh). ROM-less; ships no copyrighted Commodore ROMs.
sid = []
# Streamed game-engine audio (hundreds of console/engine formats: GameCube/Wii DSP, PS-ADPCM VAG,
# CRI HCA, Nintendo BRSTM/BCSTM/BFSTM, FMOD FSB, etc.) via libvgmstream. The core-only build is
# fully permissive (ISC, depends only on libc/libm; no ffmpeg/vorbis/mpg123 externals). libvgmstream
# has a C API, so there is no shim: src/vgmstream.rs binds it through a hand-rolled FFI and build.rs
# links + bundles libvgmstream.so. Needs a build at $VGMSTREAM_DIR (default build/vgmstream-min,
# produced by packaging/linux/build-vgmstream-min.sh). Routes only game-specific extensions
# (explicit allowlist) so it never claims generic .ogg/.wav/.flac/.mp3/etc.
vgmstream = []
# External-codec tier for vgmstream: rebuild libvgmstream with Vorbis (libvorbis/libogg, BSD) + FFmpeg
# (the LGPL ffmpeg LinAmp already builds) so it decodes the payloads the core-only build skips - Wwise
# .wem Vorbis, FMOD FSB Vorbis, Xbox 360 XMA, PS3/PSP ATRAC3, WMA-in-container. Needs the libvgmstream
# build done with VGM_EXT=1 (build-vgmstream-min.sh) plus a libvorbis build at $LIBVORBIS_DIR (default
# build/libvorbis-min, from build-libvorbis-min.sh); build.rs bundles the libvorbis .so files, and the
# libav* .so files come from the `ffmpeg` feature this enables. Combined license stays GPLv3.
vgmstream-ext = ["vgmstream", "ffmpeg"]
# PlayStation PSF1/PSF2 music (.psf/.minipsf/.psf2/.minipsf2) via libupse (GPL). libupse is C but
# opening a module needs an I/O-callback struct and a one-time init, so build.rs compiles a small C
# shim (src/psf_shim.c) via the cc crate and links libupse, bundling libupse.so. Needs a libupse build
# at $UPSE_DIR (default build/upse-min, from build-upse-min.sh). ROM-less: libupse ships its own HLE
# FakeBIOS, so no PlayStation BIOS is needed or shipped.
psf = []
# Sega Saturn SSF and Dreamcast DSF music (.ssf/.minissf/.dsf/.minidsf/.dcsf/.minidcsf) via
# Highly_Theoretical (GPL-3) + the shared psflib container parser (MIT). build.rs compiles a C shim
# (src/ssf_shim.c) and links both shared libs, bundling libhighlytheoretical.so + libpsflib.so. Needs
# builds at $HIGHLYTHEORETICAL_DIR and $PSFLIB_DIR (defaults build/highlytheoretical-min and
# build/psflib-min, from build-highly-theoretical-min.sh and build-psflib-min.sh). ROM-less: emulates
# only the SCSP/AICA sound chips, no console BIOS. (.dsf is content-sniffed so DSD .dsf still routes
# to the DSD decoder.)
ssf = []
# Capcom QSound QSF arcade music (.qsf/.miniqsf) via Highly_Quixotic (GPL-3) + the shared psflib (MIT).
# build.rs compiles a C shim (src/qsf_shim.c) and links both shared libs, bundling libhighlyquixotic.so
# + libpsflib.so. Needs builds at $HIGHLYQUIXOTIC_DIR and $PSFLIB_DIR (defaults build/highlyquixotic-min
# and build/psflib-min, from build-highly-quixotic-min.sh and build-psflib-min.sh). ROM-less:
# reimplemented QSound DSP, no copyrighted ROM. Native 24038 Hz, resampled by the pipeline.
qsf = []
# Nintendo DS NCSF music (.ncsf/.minincsf) via SSEQPlayer (WTFPL) + the shared psflib (MIT). build.rs
# compiles a C++ shim (src/ncsf_shim.cpp) and links both shared libs, bundling libsseqplayer.so +
# libpsflib.so. Needs builds at $SSEQPLAYER_DIR and $PSFLIB_DIR (defaults build/sseqplayer-min and
# build/psflib-min, from build-sseqplayer-min.sh and build-psflib-min.sh). ROM-less: SSEQPlayer is an
# SDAT sequencer, not an emulator, so no DS BIOS/firmware is involved. 44.1 kHz stereo.
ncsf = []
# Nintendo 64 USF music (.usf/.miniusf), via lazyusf2 (a Mupen64Plus-derived emulator, GPL-2.0-or-later)
# plus the shared libpsflib.so. Needs builds at $LAZYUSF_DIR and $PSFLIB_DIR (defaults build/lazyusf2-min
# and build/psflib-min, from build-lazyusf2-min.sh and build-psflib-min.sh). ROM-less: a USF carries a
# Project64 save state plus HLE RSP audio, so no N64 boot ROM is involved. 44.1 kHz stereo.
usf = []
# Nintendo DS 2SF music (.2sf/.mini2sf), via vio2sf (a DeSmuME-derived emulator, GPL-2.0-or-later) plus
# the shared libpsflib.so. Needs builds at $VIO2SF_DIR and $PSFLIB_DIR (defaults build/vio2sf-min and
# build/psflib-min, from build-vio2sf-min.sh and build-psflib-min.sh). ROM-less: DeSmuME's HLE BIOS and a
# synthesized firmware-settings block stand in, so no DS BIOS/firmware image is involved. 44.1 kHz stereo.
twosf = []
# Game Boy Advance GSF music (.gsf/.minigsf), via libgsf (which bundles a trimmed mGBA, both MPL-2.0).
# Needs a build at $LIBGSF_DIR (default build/libgsf-min, from build-libgsf-min.sh, a CMake build).
# Unlike the other *SF features it does NOT use psflib (libgsf parses the container itself). ROM-less:
# mGBA's built-in HLE BIOS stands in for the GBA BIOS, so no Nintendo BIOS is involved. 44.1 kHz stereo.
gsf = []
